name: Browser release diagnostics
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - label: test_browser_auth_accessibility
            target: tests/test_browser_auth_accessibility.py
          - label: test_browser_contextual_actions
            target: tests/test_browser_contextual_actions.py
          - label: test_browser_e2e
            target: tests/test_browser_e2e.py
          - label: test_browser_detail_geometry
            target: tests/test_browser_detail_geometry.py
          - label: test_browser_guided_import
            target: tests/test_browser_guided_import.py
          - label: test_browser_module_filters
            target: tests/test_browser_module_filters.py
          - label: test_browser_owner_security
            target: tests/test_browser_owner_security.py
          - label: test_browser_platform_status_filters
            target: tests/test_browser_platform_status_filters.py
          - label: test_browser_qa_journey_repairs
            target: tests/test_browser_qa_journey_repairs.py
          - label: test_browser_sales_numbering
            target: tests/test_browser_sales_numbering.py
          - label: dashboard_drilldown
            target: tests/test_dashboard_drilldown_browser.py
          - label: ai_queue
            target: tests/test_ai_queue_flat_rows.py::test_apex_attention_queue_browser_appearance_and_navigation
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser regression
        run: python -m pytest -q "${{ matrix.target }}" --timeout=180 --tb=short --junitxml=browser-result.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.label }}
          path: browser-result.xml
          if-no-files-found: ignore
