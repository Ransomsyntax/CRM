name: AWS runtime prerequisites
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  images-and-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_runtime_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_runtime_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Build images, probe web startup, and rehearse synthetic restore
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bash scripts/ci_aws_runtime.sh
